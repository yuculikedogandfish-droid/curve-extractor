<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI视觉理解 - 线条走向参考图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h2 { margin-bottom: 10px; font-size: 18px; color: #FFD700; }
  p { margin-bottom: 20px; font-size: 13px; color: #888; max-width: 1200px; text-align: center; line-height: 1.6; }
  .container { position: relative; }
  canvas { display: block; border: 1px solid #333; }
  .legend { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 1200px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
  .legend-color { width: 24px; height: 3px; border-radius: 2px; }
</style>
</head>
<body>
<h2>AI视觉理解 — 主要线条走向参考图</h2>
<p>以下曲线是通过视觉理解直接从原图中识别描绘的，不是像素算法自动提取的。每根曲线代表一条独立的金色光带，包含其完整的伸展、弯曲和卷曲形态。</p>
<div class="container">
  <canvas id="c" width="1672" height="941"></canvas>
</div>
<div class="legend" id="legend"></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1672, H = 941;

// 绘制原图作为底图（半透明）
const img = new Image();
img.onload = function() {
  ctx.globalAlpha = 0.35;
  ctx.drawImage(img, 0, 0, W, H);
  ctx.globalAlpha = 1.0;
  drawCurves();
};
img.src = 'input/standard_test.png';

// 通过视觉理解识别的主要光带曲线
// 每条曲线用一系列控制点定义，使用Catmull-Rom样条平滑绘制
const curves = [
  {
    name: '左侧大弧线（主光带）',
    color: '#FF6B6B',
    width: 3,
    points: [
      [470, 310], [380, 330], [300, 380], [230, 440], [180, 500],
      [150, 540], [170, 570], [220, 580], [280, 560], [350, 520],
      [420, 490], [490, 490], [550, 520], [600, 580], [630, 650],
      [640, 720], [620, 770], [570, 800], [500, 810], [430, 800],
      [400, 780]
    ]
  },
  {
    name: '右侧大弧线（主光带）',
    color: '#4ECDC4',
    width: 3,
    points: [
      [1200, 310], [1290, 330], [1370, 380], [1440, 440], [1490, 500],
      [1520, 540], [1500, 570], [1450, 580], [1390, 560], [1320, 520],
      [1250, 490], [1180, 490], [1120, 520], [1070, 580], [1040, 650],
      [1030, 720], [1050, 770], [1100, 800], [1170, 810], [1240, 800],
      [1270, 780]
    ]
  },
  {
    name: '中心主干（向上）',
    color: '#FFD700',
    width: 3,
    points: [
      [750, 820], [748, 750], [745, 680], [742, 610], [740, 540],
      [738, 470], [740, 400], [745, 340], [755, 280], [770, 230],
      [790, 190], [810, 160], [830, 140]
    ]
  },
  {
    name: '左上大弧分支',
    color: '#FF8E53',
    width: 2.5,
    points: [
      [740, 400], [700, 370], [660, 340], [620, 310], [570, 290],
      [520, 280], [470, 290], [420, 310], [380, 340], [350, 380]
    ]
  },
  {
    name: '右上大弧分支',
    color: '#5DADE2',
    width: 2.5,
    points: [
      [760, 400], [800, 370], [840, 340], [880, 310], [930, 290],
      [980, 280], [1030, 290], [1080, 310], [1120, 340], [1150, 380]
    ]
  },
  {
    name: '左下卷须',
    color: '#AF7AC5',
    width: 2,
    points: [
      [500, 600], [460, 640], [430, 680], [420, 720], [430, 750],
      [460, 760], [490, 740], [510, 700]
    ]
  },
  {
    name: '右下卷须',
    color: '#58D68D',
    width: 2,
    points: [
      [1170, 600], [1210, 640], [1240, 680], [1250, 720], [1240, 750],
      [1210, 760], [1180, 740], [1160, 700]
    ]
  },
  {
    name: '左侧细丝1',
    color: '#F1948A',
    width: 1.5,
    points: [
      [350, 350], [300, 320], [250, 310], [200, 320], [160, 350],
      [130, 390], [110, 440], [100, 490]
    ]
  },
  {
    name: '右侧细丝1',
    color: '#85C1E9',
    width: 1.5,
    points: [
      [1320, 350], [1370, 320], [1420, 310], [1470, 320], [1510, 350],
      [1540, 390], [1560, 440], [1570, 490]
    ]
  },
  {
    name: '顶部细丝',
    color: '#F7DC6F',
    width: 1.5,
    points: [
      [830, 140], [860, 120], [900, 110], [940, 120], [970, 150],
      [990, 190], [1000, 240]
    ]
  }
];

// Catmull-Rom样条插值
function catmullRom(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2*p0[0] - 5*p1[0] + 4*p2[0] - p3[0]) * t2 + (-p0[0] + 3*p1[0] - 3*p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2*p0[1] - 5*p1[1] + 4*p2[1] - p3[1]) * t2 + (-p0[1] + 3*p1[1] - 3*p2[1] + p3[1]) * t3)
  ];
}

function drawSmoothCurve(points, color, width) {
  if (points.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 发光效果
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;

  ctx.moveTo(points[0][0], points[0][1]);

  if (points.length === 2) {
    ctx.lineTo(points[1][0], points[1][1]);
  } else {
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? i : i - 1];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2 < points.length ? i + 2 : i + 1];

      for (let t = 0; t <= 1; t += 0.05) {
        const [x, y] = catmullRom(p0, p1, p2, p3, t);
        ctx.lineTo(x, y);
      }
    }
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 绘制端点
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(points[0][0], points[0][1], 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(points[points.length-1][0], points[points.length-1][1], 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawCurves() {
  for (const curve of curves) {
    drawSmoothCurve(curve.points, curve.color, curve.width);
  }

  // 图例
  const legend = document.getElementById('legend');
  for (const curve of curves) {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-color" style="background:${curve.color}"></div>${curve.name}`;
    legend.appendChild(item);
  }
}
</script>
</body>
</html>
